aid: helprnow
name: HelprNow
description: >-
  HelprNow (operating as Giftr, by Helpr Asia) is Malaysia's leading online gift marketplace,
  helping people improve relationships with loved ones through a seamless gifting experience.
  It delivers flowers, cakes, balloons, chocolates, personalised gifts, hampers and gift cards
  with same-day and nationwide delivery options. The storefront runs on Shopify
  (helpr-asia.myshopify.com), so its public technical surface is a consumer commerce site rather
  than a developer API program; the only machine-discoverable interfaces are Shopify's customer-account
  OAuth2/OpenID Connect endpoints served under giftr.my/.well-known/. Backed by 500 Global; profiled
  in the API Evangelist network as a portfolio lead.
